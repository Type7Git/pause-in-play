<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pause in Play</title>
<style>
  :root{--bg:#FAF7FB;--ink:#271F31;--muted:#6E6479;--plum:#5B3A6B;--rose:#C0584E;--card:#fff;--line:#E5DDEA}
  @media (prefers-color-scheme:dark){:root{--bg:#1D1724;--ink:#F2EDF6;--muted:#B4A9C0;--plum:#CFAEE0;--rose:#EC9188;--card:#272030;--line:#382F43}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  .card{max-width:340px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
  h1{font-size:24px;margin:0;line-height:1.2}
  h1 em{font-style:normal;color:var(--rose)}
  p{margin:0;color:var(--muted);line-height:1.5}
  button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:13px 26px;background:var(--plum);color:var(--bg);cursor:pointer;margin-top:6px}
  svg{width:72px;height:72px}
</style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#FAE8CB"/><rect x="7.5" y="10" width="3.6" height="12" rx="1.8" fill="#5B3A6B"/><rect x="13" y="10" width="3.6" height="12" rx="1.8" fill="#7D5A8E"/><path d="M19.5 10.6v10.8a.9.9 0 0 0 1.4.75l7.6-5.4a.9.9 0 0 0 0-1.5l-7.6-5.4a.9.9 0 0 0-1.4.75z" fill="#D48A22"/></svg>
    <h1>Pause <em>in</em> Play</h1>
    <p>We can't reach the internet right now. Take a slow breath out, check your connection, and try again when you're ready.</p>
    <button onclick="location.replace('https://pause-in-play.lovable.app/')">Try again</button>
    <p style="font-size:13px">In crisis? Call Lifeline on 13 11 14, or 000 in an emergency.</p>
  </div>
</body>
</html>
