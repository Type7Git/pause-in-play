name: Android test build

# Builds an installable test APK of the Pause in Play app shell.
# Runs on every push to the `capacitor` branch that touches mobile/, or manually from the Actions tab.
on:
  push:
    branches: [capacitor]
    paths: ["mobile/**", ".github/workflows/android-test-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm ci

      - name: Sync native project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: pause-in-play-test-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish to the "android-test" release (tap-to-install link for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pause-in-play-test.apk
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test pause-in-play-test.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Android test build" \
            --notes "Latest test build of the Pause in Play app from the capacitor branch (${GITHUB_SHA::7}). To install: open this page on your Android phone while signed in to GitHub, tap pause-in-play-test.apk, then allow installing apps from your browser when asked."
