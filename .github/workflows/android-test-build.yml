name: Android test build

# Builds an installable test APK of the Pause in Play app shell.
# Runs on every push to the `capacitor` branch that touches mobile/, or manually from the Actions tab.
on:
  push:
    branches: [capacitor]
    paths: ["mobile/**", ".github/workflows/android-test-build.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm ci

      - name: Sync native project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pause-in-play-test-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
